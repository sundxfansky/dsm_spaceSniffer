services:
  dsm-storage-inspector:
    build: .
    container_name: dsm-storage-inspector
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      timeout: 15s
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
